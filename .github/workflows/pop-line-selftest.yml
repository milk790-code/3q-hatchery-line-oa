name: pop-line-oa selftest(手動:用 SETUP_KEY 打 /admin/selftest 看腦子是哪顆、回覆長怎樣)
on:
  workflow_dispatch:
    inputs:
      q:
        description: 要問談單腦的一句話
        default: 拋完還是有刮痕怎麼辦
        required: false
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: 打 selftest
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
          Q: ${{ github.event.inputs.q }}
        run: |
          curl -sS --get "https://pop-line-oa.milk790.workers.dev/admin/selftest" --data-urlencode "key=$SETUP_KEY" --data-urlencode "q=$Q" | tee out.json
          echo
          python3 -c "import json;d=json.load(open('out.json'));assert d.get('ok') and not str(d.get('dbg',{}).get('anthropic','')).startswith('400'), d"
